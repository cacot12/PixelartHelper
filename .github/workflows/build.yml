name: Construir ejecutables

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Construir (Windows)
        if: matrix.name == 'windows'
        run: |
          pyinstaller --onefile --windowed --name PerlerPixel perler_app.py
          Compress-Archive -Path dist/PerlerPixel.exe -DestinationPath PerlerPixel-windows.zip
        shell: pwsh

      - name: Construir (Mac)
        if: matrix.name == 'mac'
        run: |
          pyinstaller --windowed --name PerlerPixel perler_app.py
          ditto -c -k --sequesterRsrc --keepParent dist/PerlerPixel.app PerlerPixel-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PerlerPixel-${{ matrix.name }}
          path: PerlerPixel-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
